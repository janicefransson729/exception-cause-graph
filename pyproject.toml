[project]
name = "exception-cause-graph"
version = "0.1.2"
description = "Walks the __cause__ and __context__ chains of an exception instance, producing a flat list of (type, message, traceback) tuples with depth and relationship labels."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
